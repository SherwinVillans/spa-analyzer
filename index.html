<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spa Water Analyzer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; margin: 0; }
    h1 { text-align: center; color: #38bdf8; font-size: 1.5rem; margin-bottom: 20px; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button:disabled { background: #64748b; }
    
    /* Pretty Report Formatting */
    #output { background: #1e293b; padding: 20px; border-radius: 12px; margin-top: 16px; border: 1px solid #38bdf8; color: #f8fafc; font-size: 0.95rem; line-height: 1.6; }
    #output h2, #output h3 { color: #38bdf8; margin-top: 0; }
    #output table { width: 100%; border-collapse: collapse; margin: 16px 0; background: #0f172a; border-radius: 8px; overflow: hidden; }
    #output th { background: #0284c7; color: #ffffff; text-align: left; padding: 10px; font-size: 0.85rem; }
    #output td { padding: 10px; border-bottom: 1px solid #334155; font-size: 0.85rem; }
    #output tr:last-child td { border-bottom: none; }
    #output ol, #output ul { padding-left: 20px; margin: 10px 0; }
    #output li { margin-bottom: 8px; }

    .affiliate-section { margin-top: 20px; text-align: center; }
    .buy-btn { display: inline-block; background: #f59e0b; color: #000; text-decoration: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; margin: 6px 0; }
    .disclosure { font-size: 0.75rem; color: #94a3b8; margin-top: 12px; }
  </style>
</head>
<body>

  <h1>Spa Water Analyzer</h1>

  <div class="card">
    <label><strong>1. Enter Gemini API Key:</strong></label>
    <input type="text" id="apiKey" placeholder="AIza..." />
    
    <label><strong>2. Select/Capture Test Strip Photo:</strong></label>
    <input type="file" id="imageInput" accept="image/*" />

    <button id="analyzeBtn" onclick="analyzeStrip()">Analyze Test Strip</button>
  </div>

  <div id="output" style="display:none;"></div>

  <div class="card affiliate-section">
    <h3>Chemical Reordering</h3>
    <a href="https://www.amazon.com/dp/B000000000?tag=yourtag-20" class="buy-btn" target="_blank">Order pH / Alkalinity Increaser</a><br>
    <a href="https://www.amazon.com/dp/B000000000?tag=yourtag-20" class="buy-btn" target="_blank">Order Chlorine Shock</a>
    <p class="disclosure">As an Amazon Associate, this app earns from qualifying purchases.</p>
  </div>

  <script>
    async function analyzeStrip() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const fileInput = document.getElementById('imageInput');
      const outputDiv = document.getElementById('output');
      const btn = document.getElementById('analyzeBtn');

      if (!apiKey) { alert('Please enter your API Key.'); return; }
      if (!fileInput.files[0]) { alert('Please choose or capture an image.'); return; }

      btn.disabled = true;
      btn.innerText = 'Analyzing Image...';
      outputDiv.style.display = 'block';
      outputDiv.innerHTML = '<em>Processing visual data with Gemini...</em>';

      const file = fileInput.files[0];
      const base64Image = await convertToBase64(file);

      const systemPrompt = `Analyze the uploaded image of a spa water test strip against a standard color chart.
Rules:
1. Ignore any Bromine pads/readings entirely; the spa uses Chlorine.
2. Base all values strictly on visual pad color comparisons.
3. Generate the report using markdown:

### SPA WATER ANALYSIS REPORT
**STATUS:** [OVERALL STATUS SUMMARY]

#### READING BREAKDOWN
| PARAMETER | READING | STATUS | IDEAL RANGE |
| :--- | :--- | :--- | :--- |
| Total Hardness | [Value] ppm | [Status] | 150–250 ppm |
| Free Chlorine | [Value] ppm | [Status] | 3.0–5.0 ppm |
| Total Chlorine | [Value] ppm | [Status] | Matches Free Chlorine |
| Cyanuric Acid | [Value] ppm | [Status] | 30–50 ppm |
| Total Alkalinity | [Value] ppm | [Status] | 80–120 ppm |
| pH Level | [Value] | [Status] | 7.2–7.8 |

#### PRIORITY ACTION PLAN
1. **[STEP 1 TITLE]** - [Details/Dosing]
2. **[STEP 2 TITLE]** - [Details/Dosing]
3. **[STEP 3 TITLE]** - [Details/Dosing]`;

      const payload = {
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{
          parts: [
            { inline_data: { mime_type: file.type, data: base64Image } },
            { text: "Generate the spa water analysis report for this test strip." }
          ]
        }]
      };

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const rawMarkdown = data.candidates[0].content.parts[0].text;
          outputDiv.innerHTML = marked.parse(rawMarkdown);
        } else {
          outputDiv.innerText = 'Error: Unexpected response format.\n' + JSON.stringify(data, null, 2);
        }
      } catch (err) {
        outputDiv.innerText = 'Request Failed: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Analyze Test Strip';
      }
    }

    function convertToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
